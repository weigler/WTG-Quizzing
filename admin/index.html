<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz ao Vivo · Admin</title>
<link rel="manifest" href="admin-manifest.json" />
<meta name="theme-color" content="#0B0E1A" />
<link rel="icon" href="admin-favicon.png" />
<link rel="apple-touch-icon" href="admin-apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Quiz Admin" />
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="admin-style.css" />
</head>
<body>

  <!-- tela de login -->
  <div id="login-screen" class="container">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="eyebrow" style="text-align:center;">quiz ao vivo · admin</div>
      <h1 style="text-align:center; font-size:26px; margin-top:6px;">Entrar</h1>
      <form id="login-form" style="margin-top:20px; display:flex; flex-direction:column; gap:12px;">
        <input class="input" type="email" id="login-email" placeholder="e-mail" autocomplete="username" required />
        <input class="input" type="password" id="login-password" placeholder="senha" autocomplete="current-password" required />
        <div id="login-error" class="error-text"></div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
    </div>
  </div>

  <!-- app (visível só logado) -->
  <div id="app-screen" class="container wide" style="display:none;">
    <div class="topbar">
      <div class="eyebrow">quiz ao vivo · admin</div>
      <button id="logout-btn" class="btn-link">sair</button>
    </div>
    <div id="app-root"></div>
  </div>

  <!-- modal de busca de imagens Unsplash -->
  <div id="unsplash-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <input class="input" id="unsplash-query" placeholder="Buscar imagem no Unsplash (ex: montanha, bíblia, café)" />
        <button id="unsplash-close" class="btn-link">fechar</button>
      </div>
      <div id="unsplash-results" class="unsplash-grid"></div>
      <div id="unsplash-credit-note" style="font-size:11px; color:var(--text-dim); margin-top:8px;">
        Fotos via Unsplash. Ao escolher uma imagem, o crédito ao fotógrafo é salvo automaticamente.
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="admin-app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("admin-sw.js"));
    }
  </script>
</body>
</html>
