<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz ao Vivo</title>
<link rel="icon" href="jogo/jogo-favicon.png" />
<link rel="stylesheet" href="shared/theme.css" />
<style>
  .home-wrap { align-items: center; justify-content: center; text-align: center; }
  .choice-card {
    display: block; text-decoration: none; background: var(--surface);
    border: 1.5px solid var(--surface-line); border-radius: var(--radius-lg);
    padding: 22px; margin-top: 14px; width: 100%; transition: border-color .15s ease;
  }
  .choice-card:hover { border-color: var(--gold); }
  .choice-card .big { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text); }
  .choice-card .small { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
</style>
</head>
<body>
  <div class="container home-wrap">
    <div class="eyebrow">quiz ao vivo</div>
    <h1 style="font-size:26px; margin-top:6px;">Pra onde você vai?</h1>

    <a class="choice-card" href="jogo/index.html">
      <div class="big">🎮 Entrar num jogo</div>
      <div class="small">Tenho um código de sala e vou jogar pelo celular</div>
    </a>

    <a class="choice-card" href="admin/index.html">
      <div class="big">🛠️ Painel do organizador</div>
      <div class="small">Vou cadastrar perguntas e controlar a sala ao vivo</div>
    </a>

    <a class="choice-card" href="jogo/index.html?view=results">
      <div class="big">📊 Ver resultados</div>
      <div class="small">Já joguei e quero ver meu resultado, ou o placar final de uma sala</div>
    </a>
  </div>
</body>
</html>
